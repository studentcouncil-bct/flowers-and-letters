<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#38bdf8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>For You 💙</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="clouds" aria-hidden="true">
        <div class="cloud cloud-1">☁️</div>
        <div class="cloud cloud-2">☁️</div>
        <div class="cloud cloud-3">☁️</div>
        <div class="cloud cloud-4">✨</div>
        <div class="cloud cloud-5">💧</div>
    </div>

    <div id="app">
        <!-- Sender View (For You) -->
        <div id="sender-view">
            <h1>Create a Gift 💙</h1>
            <div class="container">
                <div class="tabs">
                    <button type="button" class="tab active" id="tab-letter">💌 Letter</button>
                    <button type="button" class="tab" id="tab-flower">🪻 Flower</button>
                </div>

                <div id="form-letter" class="form-section active">
                    <label for="l-name">Dear...</label>
                    <input id="l-name" type="text" placeholder="Her name" autocomplete="off" enterkeyhint="next">

                    <label for="l-msg">Your message</label>
                    <textarea id="l-msg" placeholder="Write something sweet..." enterkeyhint="next"></textarea>

                    <label for="l-from">From...</label>
                    <input id="l-from" type="text" placeholder="Your name" autocomplete="off" enterkeyhint="done">

                    <button type="button" class="btn" id="btn-create-letter">✨ Create Magic Link</button>
                </div>

                <div id="form-flower" class="form-section">
                    <label for="f-type">Pick a flower</label>
                    <select id="f-type">
                        <option value="🪻">🪻 Blue Hyacinth</option>
                        <option value="🌸">🌸 Cherry Blossom</option>
                        <option value="🌻">🌻 Sunflower</option>
                        <option value="🌷">🌷 Tulip</option>
                        <option value="🌹">🌹 Rose</option>
                        <option value="🦋">🦋 Blue Butterfly</option>
                        <option value="💙">💙 Blue Heart</option>
                    </select>

                    <label for="f-note">Tiny note</label>
                    <input id="f-note" type="text" placeholder="Thinking of you..." autocomplete="off" enterkeyhint="done">

                    <button type="button" class="btn" id="btn-create-flower">✨ Create Magic Link</button>
                </div>

                <div id="result-box" class="result-box">
                    <h3>Gift ready 🎁</h3>
                    <p>Send the link, or let her scan the QR code.</p>
                    <img id="qr-image" alt="QR code to open the gift">
                    <input id="share-link" type="text" readonly>
                    <div class="share-actions">
                        <button type="button" class="btn" id="btn-copy">📋 Copy</button>
                        <button type="button" class="btn secondary" id="btn-share">📤 Share</button>
                    </div>
                </div>
            </div>
            <p class="tiny-note">Private gifts · only people with your link can open them</p>
        </div>

        <!-- Receiver View (For Her) -->
        <div id="receiver-view">
            <h1>For You 💙</h1>
            <div class="gift-box" id="gift-display"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
