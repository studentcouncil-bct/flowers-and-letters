<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#38bdf8">
    <title>For You 💙</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Floating Background Clouds -->
    <div class="clouds" aria-hidden="true">
        <div class="cloud cloud-1">☁️</div>
        <div class="cloud cloud-2">☁️</div>
        <div class="cloud cloud-3">☁️</div>
        <div class="cloud cloud-4">✨</div>
    </div>

    <div id="app">
        <!-- CREATOR VIEW (For You) -->
        <div id="sender-view">
            <h1>Create a Gift 💙</h1>
            <div class="container">
                <div class="tabs">
                    <button type="button" class="tab active" id="tab-letter">💌 Letter</button>
                    <button type="button" class="tab" id="tab-flower">🪻 Flower</button>
                </div>

                <!-- Letter Form -->
                <div id="form-letter" class="form-section active">
                    <label for="l-name">Dear...</label>
                    <input id="l-name" type="text" placeholder="Her name" autocomplete="off">

                    <label for="l-msg">Your message</label>
                    <textarea id="l-msg" placeholder="Write something sweet..."></textarea>

                    <label for="l-from">From...</label>
                    <input id="l-from" type="text" placeholder="Your name" autocomplete="off">

                    <button type="button" class="btn" id="btn-create-letter">✨ Generate Gift Link</button>
                </div>

                <!-- Flower Form (Camera Capture) -->
                <div id="form-flower" class="form-section">
                    <label>Take a Flower Photo 📸</label>
                    <div class="photo-upload-box">
                        <input id="f-photo-input" type="file" accept="image/*" capture="environment" class="hidden-input">
                        <button type="button" class="btn secondary" id="btn-trigger-camera">📸 Take Flower Photo</button>

                        <div id="photo-preview-card" class="photo-preview-card hidden">
                            <img id="f-preview-img" alt="Flower preview">
                            <button type="button" class="btn-text" id="btn-remove-photo">❌ Remove photo</button>
                        </div>
                    </div>

                    <label for="f-note">Tiny note</label>
                    <input id="f-note" type="text" placeholder="Thinking of you..." autocomplete="off">

                    <button type="button" class="btn" id="btn-create-flower">✨ Generate Gift Link</button>
                </div>

                <!-- Result Box -->
                <div id="result-box" class="result-box">
                    <h3>Gift Ready! 🎁</h3>
                    <p>Copy your link below to send or shorten on TinyURL.</p>

                    <label for="share-link">Gift Link</label>
                    <input id="share-link" type="text" readonly>

                    <div class="share-actions">
                        <button type="button" class="btn" id="btn-copy">📋 Copy Link</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- RECEIVER VIEW (What She Sees) -->
        <div id="receiver-view">
            <h1>For You 💙</h1>
            <div class="gift-box" id="gift-display"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
